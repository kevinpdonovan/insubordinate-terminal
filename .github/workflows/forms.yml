# Handles the two issue forms: "Suggest an item" and "Update my research focus".
name: Team forms
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency: { group: repo-write, cancel-in-progress: false }
jobs:
  form:
    if: contains(github.event.issue.labels.*.name, 'suggestion') || contains(github.event.issue.labels.*.name, 'focus')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Process form
        env:
          BODY: ${{ github.event.issue.body }}
          USER_LOGIN: ${{ github.event.issue.user.login }}
          IS_SUGGESTION: ${{ contains(github.event.issue.labels.*.name, 'suggestion') }}
        run: |
          printf '%s' "$BODY" > form.md
          if [ "$IS_SUGGESTION" = "true" ]; then python -m terminal suggest form.md "$USER_LOGIN"; else python -m terminal focus form.md "$USER_LOGIN"; fi
      - name: Commit and close
        env:
          GH_TOKEN: ${{ github.token }}
          IS_SUGGESTION: ${{ contains(github.event.issue.labels.*.name, 'suggestion') }}
        run: |
          git config user.name "terminal-bot"
          git config user.email "terminal-bot@users.noreply.github.com"
          git add data/suggestions config/participants
          git commit -m "Form: ${{ github.event.issue.title }}" || echo "nothing to commit"
          git pull --rebase && git push
          if [ "$IS_SUGGESTION" = "true" ]; then msg="Thanks: this will appear in the next published issue."; else msg="Thanks: your focus has been added to the sweep profile and takes effect next Monday."; fi
          gh issue close ${{ github.event.issue.number }} --comment "$msg"
