# Closing a "weekly-review" issue (as completed) publishes the ticked items.
name: Publish issue
on:
  issues:
    types: [closed]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: repo-write, cancel-in-progress: false }
jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'weekly-review') && github.event.issue.state_reason == 'completed'
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Publish ticked items
        env:
          BODY: ${{ github.event.issue.body }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAGGER_MODEL: ${{ vars.TAGGER_MODEL }}
        run: |
          printf '%s' "$BODY" > review-body.md
          python -m terminal publish review-body.md
      - name: Save published issue
        run: |
          git config user.name "terminal-bot"
          git config user.email "terminal-bot@users.noreply.github.com"
          git add data
          git commit -m "Publish ${{ github.event.issue.title }}" || echo "nothing to commit"
          git pull --rebase && git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4
