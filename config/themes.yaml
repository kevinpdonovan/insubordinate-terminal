# =====================================================================
#  SWEEP PROFILE — Insubordinate Finance
#  This file tells the weekly sweep what the project cares about.
#  Edit it freely: add a keyword, a city institution, an author, a theme.
#  Every change takes effect at the next weekly run.
#  Seeded from the ERC proposal (Parts B1/B2), Sept 2026.
# =====================================================================

project:
  name: "Insubordinate Finance: The Terminal"
  short_name: "InsubordinateFINANCE"
  tagline: "A weekly sweep of research, news and grey literature on the postcolonial politics of financial centres in the Global South"
  # Used to brief the AI tagger. Keep it to a paragraph; update as focuses shift.
  brief: >
    ERC project asking whether financial centres in the Global South are vectors of
    international financial subordination or offer independence from Northern financial
    dominance. It studies 11 cities (São Paulo, Santiago, Montevideo, Casablanca, Abidjan,
    Nairobi, Johannesburg, Port Louis, Mumbai, Bangkok, Ho Chi Minh City) through their
    financial histories, professional networks, sector ownership, and the circulation of
    financial devices (innovations in integration, valuation, and regulation), and the
    political disputes and critiques that surround them. Approach: postcolonial theory,
    ethnography, STS / social studies of finance ("follow-the-financial-device").
    We want items that illuminate Southern financial centres, South–South and North–South
    financial linkages, specific market devices and their controversies, and the
    professionals who build them. We do NOT want routine market reports, stock tips,
    earnings results, or generic macro commentary without an institutional angle.

