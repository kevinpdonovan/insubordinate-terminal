  - {name: "Semafor Africa", type: rss, url: "https://www.semafor.com/vertical/africa/rss.xml", filter: true}                          # check
  - {name: "Jeune Afrique — Économie", type: rss, url: "https://www.jeuneafrique.com/rubriques/economie-entreprises/feed/", filter: true} # check
  - {name: "BusinessLIVE (SA)", type: rss, url: "https://www.businesslive.co.za/rss/bd/", filter: true}                                # check
  - {name: "Daily Maverick — Business", type: rss, url: "https://www.dailymaverick.co.za/section/business-maverick/feed/", filter: true} # check
  - {name: "Médias24 (Maroc)", type: rss, url: "https://medias24.com/feed/", filter: true}                                              # check
