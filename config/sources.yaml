# =====================================================================
#  SOURCE REGISTRY — where the weekly sweep looks.
#  section: research | archive | news | grey
#  type:    rss | openalex | gdelt | email (phase 2) | zotero (phase 2)
#  filter:  true  -> items must pass the relevance gate in themes.yaml
#           false -> every item is kept (use for tightly on-topic sources)
#  Each run writes a source-health report (site/health.html). Feeds that
#  fail three weeks running are flagged there: fix or delete the entry.
#  Feed URLs marked "# check" were not reachable from the build sandbox and
#  will be confirmed (or flagged) by the first live run.
# =====================================================================

# ---------------------------------------------------------------------
# (a) NEW RESEARCH — open scholarly metadata; no login needed.
# ---------------------------------------------------------------------
research:
  - name: "OpenAlex — keyword queries"
    type: openalex
    mode: queries          # uses themes.yaml > research_queries
    lookback_days: 21      # indexing lags publication; the seen-store prevents repeats
  - name: "OpenAlex — watched journals"
    type: openalex
    mode: journals         # uses themes.yaml > watch_journals (all new articles, then scored)
    lookback_days: 14
  - name: "OpenAlex — watched authors"
    type: openalex
    mode: authors          # uses themes.yaml > watch_authors (always kept)
    lookback_days: 30
  - name: "RePEc NEP — Africa"
    type: rss
    url: "https://nep.repec.org/rss/nep-afr.rss.xml"   # check
    filter: true
  - name: "RePEc NEP — Financial development & growth"
    type: rss
    url: "https://nep.repec.org/rss/nep-fdg.rss.xml"   # check
    filter: true
  - name: "RePEc NEP — Economic history"
    type: rss
    url: "https://nep.repec.org/rss/nep-his.rss.xml"   # check
    filter: true

# ---------------------------------------------------------------------
# (b) FROM THE ARCHIVE — older work surfaced through this week's research.
# ---------------------------------------------------------------------
archive:
  - name: "OpenAlex citation trail"
    type: openalex
    mode: citations        # works cited by this week's approved research items
    older_than_years: 10
    max_items: 8
  # Phase 2: the project's Zotero group library (WP1 annotated bibliography)
  # - name: "Project Zotero library"
  #   type: zotero
  #   group_id: "0000000"

# ---------------------------------------------------------------------
# (c) NEWS — link-only. We store headline, source, date and URL; never text.
# ---------------------------------------------------------------------
news:
  - name: "GDELT global news search"
    type: gdelt              # open global news index, 65+ languages
    mode: queries            # uses themes.yaml > news_queries
    timespan: "7d"
    max_per_query: 40
  - name: "GDELT — Bloomberg"
    type: gdelt
    mode: domain
    domain: "bloomberg.com"
    query: '(Africa OR Kenya OR Nigeria OR "South Africa" OR Morocco OR Mauritius OR India OR Vietnam OR Thailand OR Brazil OR Chile OR Uruguay OR "emerging markets") (bond OR exchange OR "financial center" OR rating OR debt OR bank)'
    timespan: "7d"
    max_per_query: 75
  # Regional outlets (all filtered through the relevance gate)
  - {name: "Business Daily Africa", type: rss, url: "https://www.businessdailyafrica.com/service/rss/bd/1938306/feed.rss", filter: true}   # check
  - {name: "The East African", type: rss, url: "https://www.theeastafrican.co.ke/service/rss/tea/1289868/feed.rss", filter: true}      # check
