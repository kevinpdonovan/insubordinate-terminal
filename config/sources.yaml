# =====================================================================
#  SOURCE REGISTRY — where the weekly sweep looks.       (v2, Oct 2026)
#  section: research | archive | news | grey
#  type:    openalex | gdelt | rss | worldbank | pagewatch | email
#  filter:  true  -> items must pass the relevance gate in themes.yaml
#           false -> every item goes to the AI tagger (for sources you
#                    already targeted yourself, e.g. your own alerts)
#  The Source health page shows how each source did every week.
#  Entries marked "# check" couldn't be tested before launch.
# =====================================================================

