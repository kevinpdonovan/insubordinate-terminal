  - {name: "VIFC news (Vietnam)", type: pagewatch, url: "https://vifc.gov.vn/en/news", link_pattern: '/en/news/', org: "Vietnam International Financial Centre"}                    # check
  - {name: "CMF Chile — prensa", type: pagewatch, url: "https://www.cmfchile.cl/portal/prensa/615/w3-channel.html", link_pattern: 'w3-article|w3-propertyvalue', org: "CMF Chile"}  # check
  - {name: "Long Finance / GFCI", type: pagewatch, url: "https://www.longfinance.net/publications/long-finance-reports/", link_pattern: 'long-finance-reports/|\.pdf', org: "Long Finance / Z/Yen", filter: false}  # check
  - {name: "FSD Africa publications", type: pagewatch, url: "https://fsdafrica.org/publications/", link_pattern: '/publication', org: "FSD Africa"}                                  # check
  - {name: "AfDB documents", type: pagewatch, url: "https://www.afdb.org/en/documents", link_pattern: '/en/documents/', org: "African Development Bank"}                              # check
  - {name: "World Federation of Exchanges", type: pagewatch, url: "https://www.world-exchanges.org/news", link_pattern: '/news/', org: "WFE"}                                          # check
  # RSS feeds
