# ---------------------------------------------------------------------
# (a) NEW RESEARCH — open scholarly metadata; no login needed.
# ---------------------------------------------------------------------
research:
  - {name: "OpenAlex — keyword queries", type: openalex, mode: queries, lookback_days: 21, per_query: 25}
  - {name: "OpenAlex — watched journals", type: openalex, mode: journals, lookback_days: 14}
  - {name: "OpenAlex — watched authors", type: openalex, mode: authors, lookback_days: 30}
  # Google Scholar alerts sent to the project inbox (see README → Email alerts)
  - name: "Google Scholar alerts"
    type: email
    from: "scholaralerts-noreply@google.com"
    label: "Google Scholar alert"
    section: research
    filter: false
    min_title_len: 25

# ---------------------------------------------------------------------
# (b) FROM THE ARCHIVE — older work surfaced through this week's research.
# ---------------------------------------------------------------------
archive:
  - {name: "OpenAlex citation trail", type: openalex, mode: citations, older_than_years: 10, max_items: 8}

# ---------------------------------------------------------------------
# (c) NEWS — link-only. Headline, outlet, date and URL; never text.
# ---------------------------------------------------------------------
news:
  # GDELT is queried DAILY by the "Daily news collector" workflow (avoids its rate limit);
  # the weekly harvest reads that cache, and only calls GDELT live if the cache is empty.
  - {name: "GDELT global news search", type: gdelt, mode: queries, timespan: "7d", max_per_query: 150, spacing_seconds: 10}
  - name: "GDELT — Bloomberg"
    type: gdelt
    mode: domain
    domain: "bloomberg.com"
    query: '(Africa OR Kenya OR Nigeria OR "South Africa" OR Morocco OR Mauritius OR India OR Vietnam OR Thailand OR Brazil OR Chile OR Uruguay OR "emerging markets") (bond OR exchange OR "financial center" OR rating OR debt OR bank)'
    timespan: "7d"
    max_per_query: 150
  # Your own alerts, by email to the project inbox (best quality; see README)
  - name: "Bloomberg alerts & newsletters"
    type: email
    from: "bloomberg"
    label: "Bloomberg"
    link_pattern: 'bloomberg\.com/(news|opinion|features)/'   # real article links; tracking links are followed to find them
    resolve_redirects: true
    filter: false
  - name: "Google Alerts (email)"
    type: email
    from: "googlealerts-noreply@google.com"
    label: "Google Alert"
    filter: false
    # 47 alerts delivered daily is ~376 emails per 8-day harvest window. The default
    # max_messages is 60, which would silently read only the most recent day or so and
    # ignore the rest of the week. Raised to cover the window with headroom.
    max_messages: 500
  # Google Alerts delivered as RSS work too: paste each feed URL here, e.g.
  # - {name: "Google Alert — NIFC", type: rss, url: "https://www.google.com/alerts/feeds/XXXX/YYYY", filter: false}
  # Regional outlets (filtered through the relevance gate).
  # Removed after the 5 Oct run (404/403 from GitHub's servers): Business Daily Africa, The East African,
  # Semafor Africa, BusinessLIVE, Médias24, Sika Finance. Their stories still arrive via GDELT and Google Alerts.
  - {name: "The Africa Report", type: rss, url: "https://www.theafricareport.com/feed/", filter: true}                                  # check
  - {name: "Jeune Afrique — Économie", type: rss, url: "https://www.jeuneafrique.com/rubriques/economie-entreprises/feed/", filter: true} # check
  - {name: "Mint — Economy", type: rss, url: "https://www.livemint.com/rss/economy", filter: true}                                     # check
  - {name: "VnExpress International — Business", type: rss, url: "https://e.vnexpress.net/rss/business.rss", filter: true}            # check
  - {name: "Valor Econômico", type: rss, url: "https://valor.globo.com/rss/valor/", filter: true}                                       # check
  - {name: "FT — Emerging markets", type: rss, url: "https://www.ft.com/emerging-markets?format=rss", filter: true}                    # check
  - {name: "Bloomberg — Markets (public feed)", type: rss, url: "https://feeds.bloomberg.com/markets/news.rss", filter: true}          # check

# ---------------------------------------------------------------------
# (d) GREY LITERATURE — IFIs, central banks, regulators, think tanks.
# ---------------------------------------------------------------------
grey:
  # Searchable databases (use themes.yaml > grey_queries)
  - {name: "World Bank Documents & Reports", type: worldbank, lookback_days: 45, rows: 30}
  - {name: "OpenAlex — reports", type: openalex, mode: reports, lookback_days: 30}
  - {name: "OpenAlex — IFI working-paper series", type: openalex, mode: series, lookback_days: 30}   # uses themes.yaml > watch_series
  # Removed after the 2026-W41 run (6 Oct). Blocked to GitHub's servers with 403: IMF, UNCTAD,
  # CGD, Eurodad, JSE, WFE, Bank Al-Maghrib. Dead URLs with no working replacement (404): ODI,
  # Finance in Common, AfDB. Page watchers that found no links because the listing is rendered in
  # JavaScript: CMA Kenya, VIFC, CMF Chile, Long Finance, FSD Africa (its RSS feed still works).
  # Only the IMF is covered by a standing Google Alert; the others now have no substitute.
  # Publication / press pages watched for NEW links (first run records a baseline)
  - {name: "Central Bank of Kenya", type: pagewatch, url: "https://www.centralbank.go.ke/", link_pattern: '\.pdf|/20\d\d/|press|publication', org: "Central Bank of Kenya"}              # check
  - {name: "BCEAO publications", type: pagewatch, url: "https://www.bceao.int/fr/publications", link_pattern: '/fr/(publications|communique)', org: "BCEAO"}                             # check
  - {name: "AMMC (Maroc)", type: pagewatch, url: "https://www.ammc.ma/fr/actualites", link_pattern: '/actualites/', org: "AMMC"}                                                        # check
  - {name: "South African Reserve Bank", type: pagewatch, url: "https://www.resbank.co.za/en/home/publications", link_pattern: '/publications/', org: "SARB"}                          # check
  - {name: "FSC Mauritius communiqués", type: pagewatch, url: "https://www.fscmauritius.org/media-corner/communiques-press-releases", link_pattern: 'media-corner|\.pdf', org: "FSC Mauritius"}  # check
  - {name: "RBI press releases", type: pagewatch, url: "https://www.rbi.org.in/Scripts/BS_PressReleaseDisplay.aspx", link_pattern: 'prid=', org: "Reserve Bank of India"}         # check
  # RSS feeds
  # BIS retired its all-publications feed (404). These two are live and parse; central bank
  # speeches are a strong source for this project — governors on financial centres and markets.
  - {name: "BIS — FSI publications", type: rss, url: "https://www.bis.org/doclist/bis_fsi_publs.rss", filter: true}
  - {name: "BIS — central bank speeches", type: rss, url: "https://www.bis.org/doclist/cbspeeches.rss", filter: true}
  # Bretton Woods Project serves HTML at every /feed/ path, so it is watched as a page instead.
  - {name: "Bretton Woods Project", type: pagewatch, url: "https://www.brettonwoodsproject.org/articles/", link_pattern: '/20\d\d/\d\d/', org: "Bretton Woods Project"}
  - {name: "Debt Justice", type: rss, url: "https://debtjustice.org.uk/feed", filter: true}                                           # check
  - {name: "OMFIF", type: rss, url: "https://www.omfif.org/feed/", filter: true}                                                      # check
  - {name: "FSD Africa (RSS)", type: rss, url: "https://fsdafrica.org/feed/", filter: true}                                           # check
  - {name: "Boston University GDP Center", type: rss, url: "https://www.bu.edu/gdp/feed/", filter: true}                             # check
  - {name: "AfronomicsLaw", type: rss, url: "https://www.afronomicslaw.org/rss.xml", filter: true}                                   # check
  - {name: "Phenomenal World", type: rss, url: "https://www.phenomenalworld.org/feed/", filter: true}                                 # check
  - {name: "Developing Economics", type: rss, url: "https://developingeconomics.org/feed/", filter: true}                             # check
  - {name: "ROAPE blog", type: rss, url: "https://roape.net/feed/", filter: true}                                                     # check
  - {name: "LSE Africa at LSE", type: rss, url: "https://blogs.lse.ac.uk/africaatlse/feed/", filter: true}                           # check
